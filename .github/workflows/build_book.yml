name: Book and API documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Reject proof placeholders
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' MeraConstraints.lean $(find MeraConstraints -name '*.lean'); then
            exit 1
          fi
      - name: Build and check book and API
        run: node scripts/build-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meraconstraints-website
          path: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
